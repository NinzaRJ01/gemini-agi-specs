- Real-time responsive statusline gauges below the AGY prompt (<15ms budget).

- Meeting recording with dual-channel loopback audio & **First Go to AGI** dynamic synthesis.
- Autonomous PR reviewer mimicry pipelines and benchmark suites (`digest`).
- Autonomous skill-forging plugins and eval-backed coding directives.

### 1.2 Architectural Invariant: The "First Go to AGI" Intelligence Rule
Across all speech and text processing pipelines, **Cloud AGI (Google Antigravity / Gemini CLI)** is always the primary tier. Transcripts and developer commands are first passed to AGI for high-level semantic reasoning, Product Vision (PV) synthesis, and architectural decisions. Local LLMs (LM Studio / Ollama) and deterministic NLP operate strictly as automatic failover tiers when offline or during network timeouts.

## Section 3: Autonomous Step-by-Step Execution Directives

The agent must execute the following 7 phases in order:

### Phase 1: Host Dependency Verification & Installation
1. Verify Homebrew is installed. If missing, install via official script:
   ```bash
   which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
   eval "$(/opt/homebrew/bin/brew shellenv)"
   ```
2. Install required CLI formulas and libraries:
   ```bash
   brew install python@3.11 ffmpeg portaudio portmidi pkg-config cmake whisper.cpp
   ```
3. Verify `/opt/homebrew/bin/whisper-cli` and `ffmpeg` are available.

### Phase 2: Agent Runtime & Brain Reconstitution
1. Ensure `~/.gemini/config/` directory structure exists.
2. If `gemini_config.tar.gz` or transfer bundle is present, unpack it to `~/.gemini/`:
   ```bash
   mkdir -p ~/.gemini
   tar -xzvf /path/to/gemini_config.tar.gz -C ~/.gemini/
   ```
3. If setting up from scratch/git, populate `~/.gemini/config/plugins` and `~/.gemini/config/skills`.
4. Ensure `~/.gemini/config/scripts/statusline.py` is executable:
   ```bash
   chmod +x ~/.gemini/config/scripts/statusline.py
   ```

### Phase 3: Native Swift Compilation (Apple Silicon)
1. Locate `meeting_recorder.swift` and compile with optimizations:
   ```bash
   cd ~/EmptyOne
   swiftc -O -framework AVFoundation -framework ScreenCaptureKit -framework Cocoa -framework CoreAudio \
     meeting_recorder.swift -o meeting-recorder
   chmod +x meeting-recorder
   ```
2. Locate `whisper_pill.swift` and compile with optimizations:
   ```bash
   swiftc -O -framework Cocoa -framework Metal -framework AppKit \
     whisper_pill.swift -o whisper-pill
   chmod +x whisper-pill
   ```

### Phase 4: Python Runtime & Reviewer Package (`digest`)
1. Create isolated Python 3.11 virtual environment:
   ```bash
   cd ~/EmptyOne
   python3.11 -m venv .venv
   source .venv/bin/activate
   pip install --upgrade pip setuptools wheel
   ```
2. Install core Python dependencies:
   ```bash
   pip install openai-whisper sounddevice numpy rich click requests fastapi uvicorn websockets pydantic pytest
   ```
3. Install `digest` package in editable mode:
   ```bash
   pip install -e ./digest
   ```

### Phase 5: Whisper Metal Local Model Deployment
1. Ensure directory `~/.whisper-models/` exists:
   ```bash
   mkdir -p ~/.whisper-models
   ```
2. If bundled models exist in bundle, copy them:
   ```bash
   cp /path/to/bundle/models/*.bin ~/.whisper-models/ 2>/dev/null || true
   ```
3. If models are absent, download the high-speed default Metal model:
   ```bash
   if [ ! -f ~/.whisper-models/ggml-base.en.bin ]; then
       echo "Downloading ggml-base.en.bin..."
       curl -L -C - "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin" \
         -o ~/.whisper-models/ggml-base.en.bin
   fi
   ```

### Phase 6: Local Binaries & Path Configuration
1. Ensure `~/.local/bin` exists and symlink native binaries:
   ```bash
   mkdir -p ~/.local/bin

# Component Specification 01: Multi-Line Responsive Developer Statusline (`statusline.py`)
**Component ID:** `agy-statusline`  
**Target Path:** `~/.gemini/config/scripts/statusline.py`  
**Execution Budget:** Sub-15ms ($< 15\text{ ms}$) total wall-clock runtime  
**Terminal Footprint:** Dynamic 1, 2, or 3 lines auto-balanced to `terminal_width`  
**Dependencies:** Python 3.10+ standard library only (`sys`, `os`, `json`, `re`, `subprocess`). Zero external pip packages.

---

## 1. Component Architecture & Telemetry Pipeline

The statusline operates as a high-performance streaming visual gauge positioned directly below the Antigravity (`agy`) chat prompt. It consumes telemetry JSON on `stdin` streamed from the AGY engine on every prompt cycle, computes token dynamics, measures prompt caching ratios, probes git churn safely with micro-timeouts, and outputs color-balanced ANSI lines.

```mermaid
flowchart TD
    subgraph AntigravityEngine["Antigravity CLI (agy) Engine"]
        CLI["agy Prompt Loop"] -->|"JSON Telemetry on stdin (terminal_width, model, tokens, cwd, quota)"| STATUS["statusline.py"]
    end

    subgraph StatuslineEngine["statusline.py Processing Pipeline (<15ms)"]
        PARSE["1. JSON Ingestion & ANSI Sanitization"] --> DYN["2. Context Gauge & Token Formatter"]
        DYN --> CACHE["3. Prompt Cache Ratio Calculator"]
        CACHE --> GIT["4. Git Worktree Probe (80ms strict timeout)"]
        GIT --> QUOTA["5. Quota & Cost Aggregator"]
        QUOTA --> WRAP["6. Responsive Layout Balancer (1, 2, or 3 Lines)"]
    end

    subgraph TerminalOutput["Terminal Prompt Display"]
        WRAP -->|"Wide (≥140 cols)"| L1["Row 1: All Metrics on Single Line"]
        WRAP -->|"Standard (75-139 cols)"| L2["Row 1: AI Model & Context Dynamics\nRow 2: Git Churn, Quota, Cost, Artifacts"]
        WRAP -->|"Narrow (<75 cols)"| L3["Row 1: Model & Mode\nRow 2: Context Gauge\nRow 3: Git & Quota"]
    end

    STATUS --> PARSE
```

---

## 2. Invariants & Performance Guardrails

1. **Sub-15ms Execution Budget:** The script must never block the interactive typing experience of the developer. No network calls, disk write stalls, or complex imports are permitted.
2. **Git Probe Invariants:**
   - Probing `git rev-parse` and `git diff` must have strict micro-timeouts (`timeout=0.08s` / 80ms) to prevent freezing when working over network filesystems (NFS/SSHFS) or massive monorepos.
   - If not inside a git repository, the git segment is cleanly omitted without error.
3. **Prompt Cache Efficiency Ratio:**
   $$\text{Cache Ratio} = \frac{\text{cache\_read\_input\_tokens}}{\text{cache\_read\_input\_tokens} + \text{input\_tokens}} \times 100\%$$
   Displayed in cyan as `(Cache: XX%)` to provide instant feedback on prompt caching performance.
4. **Visual Context Window Gauge:**
   A 5-block visual density meter `[■■□□□]` color-coded dynamically:
   - Green ($< 60\%$ consumed)
   - Yellow ($60\% - 79\%$ consumed)
   - Red + Alert $\ge 80\%$ consumed (`⚠️ 📊 Ctx: 850k [■■■■□] 81%`)
5. **Zero-Crash Resilience:** All exceptions are caught silently with graceful fallbacks. An empty output is preferred over a broken prompt.

| $75 - 139$ columns | **Two Lines (Balanced)** | `⚡ Model: 3.8 Flash:high [AUTO] │ 📊 Ctx: 275k [■□□□□] 20% (Cache: 99%)` | `🌿 Git: main* (+14 -3) │ ⏳ Quota: 92% (5h) │ 💰 Cost: $0.0350 │ 📦 Arts: 4` | *(Omitted)* |
| $< 75$ columns | **Three Lines (Compact)** | `⚡ Model: 3.8 Flash [AUTO]` | `📊 Ctx: 275k [■□□□□] 20%` | `🌿 Git: main* │ ⏳ Quota: 92%` |

## 4. Complete Executable Source Code

Write this file to `~/.gemini/config/scripts/statusline.py` and run `chmod +x ~/.gemini/config/scripts/statusline.py`:

```python
#!/usr/bin/env python3
"""
Antigravity Multi-Line Developer Statusline
Automatically adapts between 1, 2, or 3 lines depending on terminal window width.
When window size cannot fit all metrics on a single line, splits cleanly into logical rows
so all vital metrics and rich labels remain fully visible.
Designed to never crash, auto-fit terminal width, and execute in <15ms.
"""

import sys
import os
import json
import re
import subprocess

def fmt_tokens(n):
    try:
        n = int(n or 0)
    except Exception:
        return "0"
    if n >= 1_000_000:
        return f"{n/1_000_000:.1f}M"
    if n >= 1_000:
        return f"{n/1_000:.1f}k"
    return str(n)

def strip_ansi(text):
    return re.sub(r"\033\[[0-9;]*m", "", text)

def parse_model(val):
    if isinstance(val, str):
        return val
    if isinstance(val, dict):
        return (
            val.get("display_name")
            or val.get("name")
            or val.get("label")
            or val.get("model_id")
            or val.get("id")
            or val.get("title")
            or (next((v for v in val.values() if isinstance(v, str)), "") if val else "")
            or "Gemini"
        )
    return "Gemini"

def parse_effort(effort_val, model_val):
    if isinstance(effort_val, str) and effort_val:
        return effort_val
    if isinstance(model_val, dict):
        eff = model_val.get("effort")
        if isinstance(eff, str) and eff:
            return eff
    return None

def get_git_info(cwd):
    """
    Safely inspects git status in cwd with strict timeouts (<80ms).
    Returns None if cwd is not a git repository.
    """
    if not cwd or not os.path.isdir(cwd):
        return None
    try:
        chk = subprocess.run(
            ["git", "-C", cwd, "rev-parse", "--is-inside-work-tree"],
            capture_output=True, text=True, timeout=0.08
        )
        if chk.returncode != 0 or chk.stdout.strip() != "true":
            return None

        b_res = subprocess.run(
            ["git", "-C", cwd, "rev-parse", "--abbrev-ref", "HEAD"],
            capture_output=True, text=True, timeout=0.08
        )
        branch = b_res.stdout.strip() or "HEAD"
        if branch == "HEAD":
            h_res = subprocess.run(
                ["git", "-C", cwd, "rev-parse", "--short", "HEAD"],
                capture_output=True, text=True, timeout=0.08
            )
            branch = f":{h_res.stdout.strip()}"

        d_res = subprocess.run(
            ["git", "-C", cwd, "diff", "HEAD", "--shortstat"],
            capture_output=True, text=True, timeout=0.08
        )
        diff_out = d_res.stdout.strip()
        if not diff_out and d_res.returncode != 0:
            d_res = subprocess.run(
                ["git", "-C", cwd, "diff", "--shortstat"],
                capture_output=True, text=True, timeout=0.08
            )
            diff_out = d_res.stdout.strip()

        u_res = subprocess.run(
            ["git", "-C", cwd, "status", "--porcelain"],
            capture_output=True, text=True, timeout=0.08
        )
        status_lines = u_res.stdout.strip().splitlines() if u_res.stdout else []
        is_dirty = len(status_lines) > 0
        untracked = sum(1 for l in status_lines if l.startswith("??"))

        ins, dels = 0, 0
        if diff_out:
            m_ins = re.search(r"(\d+) insertion", diff_out)
            m_del = re.search(r"(\d+) deletion", diff_out)
            if m_ins: ins = int(m_ins.group(1))
            if m_del: dels = int(m_del.group(1))

        return {
            "branch": branch,
            "dirty": is_dirty,
            "insertions": ins,
            "deletions": dels,
            "untracked": untracked
        }
    except Exception:
        return None

def main():
    try:
        raw = sys.stdin.read().strip()
        if not raw:
            return

        data = json.loads(raw)
        if not isinstance(data, dict):
            return

        # ANSI Color Palette
        RST = "\033[0m"
        DIM = "\033[2m"
        CYAN = "\033[36m"
        GREEN = "\033[32m"
        YELLOW = "\033[33m"
        MAGENTA = "\033[35m"
        BLUE = "\033[34m"
        RED = "\033[31m"

        try:
            terminal_width = int(data.get("terminal_width") or 80)
        except Exception:
            terminal_width = 80

        # Model & Mode
        raw_model = data.get("model")
        model_name = parse_model(raw_model)
        clean_model = (
            model_name.replace("Gemini ", "")
            .replace(" (High)", "")
            .replace(" (Medium)", "")
            .replace(" (Low)", "")
            .strip()
        )
        if not clean_model:
            clean_model = "Gemini"

        effort = parse_effort(data.get("effort"), raw_model)
        raw_mode = data.get("editorMode") or data.get("agent_state") or "auto"
        mode = (raw_mode if isinstance(raw_mode, str) else "auto").upper()

        model_str = f"{CYAN}⚡ Model: {clean_model}{RST}"
        if effort:
            model_str += f"{DIM}:{effort}{RST}"
        model_str += f" {DIM}[{mode}]{RST}"

        # Context Window Dynamics
        cw = data.get("context_window") or {}
        total_in = cw.get("total_input_tokens") or 0
        total_out = cw.get("total_output_tokens") or 0
        total_tok = (total_in + total_out) if (total_in or total_out) else (data.get("total_tokens") or 0)
        max_size = cw.get("context_window_size") or 1048576

        used_pct = cw.get("used_percentage")
        if used_pct is not None:
            pct = float(used_pct)
        elif max_size > 0 and total_tok > 0:
            pct = (total_tok / max_size) * 100.0
        else:
            pct = 0.0

        bar_len = 5
        filled = min(bar_len, max(0, round(pct / 100.0 * bar_len)))
        bar = "■" * filled + "□" * (bar_len - filled)

        if pct >= 80.0:
            ctx_color = RED
            alert = "⚠️ "
        elif pct >= 60.0:
            ctx_color = YELLOW
            alert = ""
        else:
            ctx_color = GREEN
            alert = ""

        ctx_str = f"{ctx_color}{alert}📊 Ctx: {fmt_tokens(total_tok)} [{bar}] {pct:.0f}%{RST}"

        # Prompt Cache Efficiency
        cur_usage = cw.get("current_usage") or {}
        cache_read = cur_usage.get("cache_read_input_tokens") or 0
        cur_in = cur_usage.get("input_tokens") or 0
        if cache_read > 0 and (cache_read + cur_in) > 0:
            cache_pct = (cache_read / (cache_read + cur_in)) * 100.0
            ctx_str += f" {CYAN}(Cache: {cache_pct:.0f}%){RST}"

        # Pending Tool Confirmation Alert
        tool_pending_str = None
        if data.get("tool_confirmation_pending"):
            tool_pending_str = f"{YELLOW}🔔 Waiting: Tool Approval{RST}"

        # Git Status
        cwd = data.get("cwd") or (data.get("workspace") or {}).get("current_dir") or os.getcwd()
        git_info = get_git_info(cwd)
        git_str = None
        if git_info:
            branch = git_info["branch"]
            dirty = git_info["dirty"]
            ins = git_info["insertions"]
            dels = git_info["deletions"]
            untracked = git_info["untracked"]

            dirty_flag = "*" if dirty else ""
            branch_color = YELLOW if dirty else MAGENTA
            git_str = f"{branch_color}🌿 Git: {branch}{dirty_flag}{RST}"

            churn_elements = []
            if ins > 0: churn_elements.append(f"{GREEN}+{ins}{RST}")
            if dels > 0: churn_elements.append(f"{RED}-{dels}{RST}")
            if not churn_elements and untracked > 0: churn_elements.append(f"{YELLOW}?{untracked}{RST}")

            if churn_elements:
                git_str += f" (Diff: {' '.join(churn_elements)})"

        # Quota Tracking
        quota_str = None
        quota = data.get("quota")
        if isinstance(quota, dict):
            g5h = quota.get("gemini-5h")
            if isinstance(g5h, dict) and "remaining_fraction" in g5h:
                pct_quota = int(round(g5h["remaining_fraction"] * 100))
                quota_str = f"{GREEN}⏳ Quota: {pct_quota}% (5h){RST}"
        elif isinstance(quota, list):
            for bucket in quota:
                if isinstance(bucket, dict):
                    p = bucket.get("percentage_remaining") or bucket.get("remaining")
                    name = str(bucket.get("display_name") or bucket.get("name") or "")
                    if p is not None and ("5" in name or "five" in name.lower()):
                        quota_str = f"{GREEN}⏳ Quota: {int(round(p))}% (5h){RST}"
                        break

        # Cost & Spend
        spend_str = None
        try:
            total_usd = float(data.get("total_usd") or 0.0)
            sub_usd = float(data.get("subagent_usd") or 0.0)
            if total_usd > 0:
                spend_str = f"{YELLOW}💰 Cost: ${total_usd:.4f}{RST}"
                if sub_usd > 0 and terminal_width > 90:
                    spend_str += f"{DIM} (sub: ${sub_usd:.3f}){RST}"
        except Exception:
            pass

        # Artifacts Count
        art_str = None
        try:
            artifacts = int(data.get("artifact_count") or 0)
            if artifacts > 0:
                art_str = f"{BLUE}📦 Arts: {artifacts}{RST}"
        except Exception:
            pass

        # Running Subagents
        subagent_str = None
        try:
            subagents = data.get("subagents")
            cnt = len(subagents) if isinstance(subagents, list) else (subagents if isinstance(subagents, int) else 0)
            if cnt > 0:
                subagent_str = f"{MAGENTA}🤖 Agents: {cnt}{RST}"
        except Exception:
            pass

        # Step Count
        step_str = None
        try:
            step = int(data.get("step_count") or 0)
            if step > 0:
                step_str = f"{DIM}Turn: {step}{RST}"
        except Exception:
            pass

        sep = f" {DIM}│{RST} "

        # Layout Balancer
        row1_items = [x for x in [model_str, ctx_str] if x]
        row2_items = [x for x in [git_str, quota_str, tool_pending_str, spend_str, art_str, subagent_str, step_str] if x]
        all_items = row1_items + row2_items

        # Check Single Line
        single_line = sep.join(all_items)
        if len(strip_ansi(single_line)) <= terminal_width:
            print(single_line)
            return

        # Check Two Balanced Lines
        r1_rendered = sep.join(row1_items)
        r2_rendered = sep.join(row2_items)
        if len(strip_ansi(r1_rendered)) <= terminal_width and len(strip_ansi(r2_rendered)) <= terminal_width:
            print(r1_rendered)
            print(r2_rendered)
            return

        # Pack Greedily across 2-3 lines
        lines = []
        curr_line = []
        for it in all_items:
            test_line = curr_line + [it]
            rendered = sep.join(test_line)
            if len(strip_ansi(rendered)) <= terminal_width:
                curr_line.append(it)
            else:
                if curr_line:
                    lines.append(sep.join(curr_line))
                    curr_line = [it]
                else:
                    lines.append(it)
                    curr_line = []
        if curr_line:
            lines.append(sep.join(curr_line))

        print("\n".join(lines[:3]))

    except Exception:
        return

if __name__ == "__main__":
    try:
        main()
    except Exception:
        sys.exit(0)
```

## 1. System Topology & Dual-Pipeline Architecture

The Whisper voice system consists of two distinct pipelines sharing a common in-memory audio capture engine:
1. **Pipeline A (Instant Push-to-Talk Dictation):** Ultra-low latency voice-to-cursor streaming HUD for instant typing into any text field or AGI chat prompt.
2. **Pipeline B (Meeting Recording & AGI Multi-Tier Synthesis):** Long-form audio recording with local DLP privacy redaction, routed **first to AGI (Gemini CLI / Antigravity with `noteworthy-notes`)**, with local LLM fallback, generating an interactive click-to-seek HTML dashboard.

```mermaid

    subgraph Input["🎧 Audio Capture & Ingestion"]
        MIC["Mac Microphone"] -->|"48kHz PCM"| ENG["AVAudioEngine Tap"]
        ENG -->|"Downsample Stride = 3"| BUF["In-Memory 16kHz PCM Buffer"]
    end

## 2. Architectural Pillars & Design Invariants

### 2.1 The "First Go to AGI" Multi-Tier Intelligence Hierarchy
Meeting transcripts are never summarized using simple, brittle local heuristics when cloud intelligence is reachable. The summarization engine follows a strict 3-tier cascade:
1. **Tier 1 (Primary - Cloud AGI):** Transcripts are routed **directly to Google Antigravity (AGY) / Gemini 3.8**. It leverages the `noteworthy-notes` skill to extract:
   - High-caliber conceptual themes (never verbatim sentence repetition).
   - Dynamic domain sections: *Product Vision (PV) & Scope*, *Technical Architecture & Invariants*, *Identified Risks & Blockers*, and *Action Items with Owners*.
2. **Tier 2 (Offline Fallback - Local LLM):** If the Mac has no internet access or Gemini CLI times out, the system automatically redirects to a local LLM runner (LM Studio or Ollama on `http://127.0.0.1:1234` running `qwen2.5-coder:7b`).
3. **Tier 3 (Safety Fallback - Deterministic NLP):** If no LLM daemon is running, a zero-dependency heuristic parser extracts bullet points and timestamps to ensure an executive summary is always produced.

### 2.2 Local Privacy & DLP (Data Loss Prevention) Middleware
Before any meeting transcript is passed to Tier 1 Cloud AGI, `summarize_meeting.py` executes local sanitization:
- High-entropy secrets, bearer tokens, AWS credentials, API keys (`AIzaSy...`, `sk-...`), and passwords are masked with variables (e.g. `[REDACTED_API_KEY_1]`).
- A local `sanitization_report.json` maps redacted variables so private data never leaves the developer's machine.

### 2.3 English-Only Locking & Hallucination Elimination
Unconstrained multilingual models (such as default Whisper without `-l en` or Parakeet-TDT) frequently misclassify microphone noise, whispered speech, or coughing as foreign phonetics (most notoriously Russian Cyrillic: *"Мейк а Финишуп док."*).
- **Live HUD Streaming:** Strictly uses `ggml-base.en.bin`. Because `.en` models completely omit non-English vocabulary tokens, Russian or foreign hallucinations are physically impossible.
- **Final Pass:** Strictly invokes `whisper-cli` with `-l en` to disable language auto-detection and enforce English decoder priors.

### 2.4 macOS Security & Screen-Share Privacy
The Swift floating pill HUD (`whisper_pill.swift`) sets `self.sharingType = .none` on its `NSWindow`. This informs the macOS Window Server to omit the HUD from all ScreenCaptureKit streams, hiding the live transcription pill from Zoom, Google Meet, and Microsoft Teams screen-sharing sessions.

```python
"""
whisper_metal.py: Python wrapper for Metal-accelerated Whisper on Apple Silicon.
Provides an easy-to-use Python interface to transcribe any audio or video file.
"""

from __future__ import annotations

import json
import os
import re
import shutil
import subprocess
import tempfile
from pathlib import Path
from typing import Any, Dict, List, Optional


MODELS_DIR = Path(os.environ.get("WHISPER_MODELS_DIR", Path.home() / ".whisper-models"))


def get_model_path(model_name: str = "large-v3-turbo") -> Path:
    """Resolve model path or download if missing."""
    aliases = {
        "turbo": "ggml-large-v3-turbo.bin",
        "large-v3-turbo": "ggml-large-v3-turbo.bin",
        "base.en": "ggml-base.en.bin",
        "base": "ggml-base.bin",
        "small": "ggml-small.bin",
        "small.en": "ggml-small.en.bin",
        "medium": "ggml-medium.bin",
        "large": "ggml-large-v3.bin",
        "large-v3": "ggml-large-v3.bin",
        "tiny": "ggml-tiny.bin",
    }
    filename = aliases.get(model_name, f"ggml-{model_name}.bin" if not model_name.startswith("ggml-") else model_name)
    if not filename.endswith(".bin"):
        filename += ".bin"

    model_path = MODELS_DIR / filename
    if not model_path.exists():
        if model_name in ("turbo", "large-v3-turbo") and (MODELS_DIR / "ggml-base.en.bin").exists():
            return MODELS_DIR / "ggml-base.en.bin"

        MODELS_DIR.mkdir(parents=True, exist_ok=True)
        url = f"https://huggingface.co/ggerganov/whisper.cpp/resolve/main/{filename}"
        print(f"Downloading model {filename}...")
        subprocess.run(["curl", "-L", "--fail", "-C", "-", "-o", str(model_path), url], check=True)

    return model_path


def transcribe(
    audio_path: str | Path,
    model: str = "large-v3-turbo",
    language: str = "en",
    threads: int = 8,
    output_srt: bool = False,
    output_vtt: bool = False,
) -> Dict[str, Any]:
    audio_path = Path(audio_path).expanduser().resolve()
    if not audio_path.exists():
        raise FileNotFoundError(f"Audio file '{audio_path}' does not exist.")

    model_path = get_model_path(model)

    with tempfile.TemporaryDirectory() as tmp_dir:
        tmp_wav = Path(tmp_dir) / "converted.wav"
        out_prefix = Path(tmp_dir) / "output"

        # Preprocess to 16kHz mono WAV using ffmpeg
        ffmpeg_cmd = [
            "ffmpeg",
            "-y",
            "-hide_banner",
            "-loglevel", "error",
            "-i", str(audio_path),
            "-ar", "16000",
            "-ac", "1",
            "-c:a", "pcm_s16le",
            str(tmp_wav),
        ]
        subprocess.run(ffmpeg_cmd, check=True)

        whisper_cmd = [
            "whisper-cli",
            "-m", str(model_path),
            "-f", str(tmp_wav),
            "-t", str(threads),
            "-l", language,
            "-otxt",
            "--output-file", str(out_prefix),
        ]
        if output_srt:
            whisper_cmd.append("-osrt")
        if output_vtt:
            whisper_cmd.append("-ovtt")

        result = subprocess.run(
            whisper_cmd,
            stdout=subprocess.PIPE,
            stderr=subprocess.PIPE,
            text=True,
            check=True,
        )

        txt_file = Path(f"{out_prefix}.txt")
        text = txt_file.read_text(encoding="utf-8").strip() if txt_file.exists() else ""

        segments = []
        pattern = re.compile(r"\[(\d{2}:\d{2}:\d{2}\.\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}\.\d{3})\]\s*(.*)")
        for line in result.stdout.splitlines():
            match = pattern.match(line.strip())
            if match:
                start, end, seg_text = match.groups()
                segments.append({
                    "start": start,
                    "end": end,
                    "text": seg_text.strip(),
                })

        srt_content = None
        srt_file = Path(f"{out_prefix}.srt")
        if output_srt and srt_file.exists():
            srt_content = srt_file.read_text(encoding="utf-8")

        vtt_content = None
        vtt_file = Path(f"{out_prefix}.vtt")
        if output_vtt and vtt_file.exists():
            vtt_content = vtt_file.read_text(encoding="utf-8")

        return {
            "text": text,
            "segments": segments,
            "model": str(model_path),
            "srt": srt_content,
            "vtt": vtt_content,
        }


if __name__ == "__main__":
    import sys
    if len(sys.argv) < 2:
        print("Usage: python whisper_metal.py <audio_or_video_file> [model]")
        sys.exit(1)

    target_file = sys.argv[1]
    target_model = sys.argv[2] if len(sys.argv) > 2 else "large-v3-turbo"
    print(f"Transcribing '{target_file}' with {target_model}...")
    res = transcribe(target_file, model=target_model)
    print("\n--- Transcription ---")
    print(res["text"])
```

        visualEffect.layer?.masksToBounds = true

        visualEffect.layer?.borderWidth = 1.0
        
        statusLabel.isEditable = false
        statusLabel.isSelectable = false
        statusLabel.isBezeled = false
        statusLabel.drawsBackground = false
        statusLabel.font = NSFont.systemFont(ofSize: 15, weight: .medium)
        statusLabel.textColor = .white
        statusLabel.alignment = .left
        statusLabel.maximumNumberOfLines = 3
        statusLabel.lineBreakMode = .byWordWrapping
        statusLabel.cell?.wraps = true
        statusLabel.cell?.isScrollable = false
        statusLabel.frame = NSRect(x: 20, y: 12, width: pillWidth - 40, height: pillHeight - 24)
        
        visualEffect.addSubview(statusLabel)
        self.contentView = visualEffect
        centerOnScreen()
    }
    
    func centerOnScreen() {
        if let screen = NSScreen.main {
            let screenRect = screen.visibleFrame
            let x = screenRect.midX - pillWidth / 2
            let y = screenRect.minY + 90
            self.setFrame(NSRect(x: x, y: y, width: pillWidth, height: pillHeight), display: true)
        }
    }
    
    func updateLiveText(_ text: String, isFinished: Bool = false) {
        DispatchQueue.main.async {
            let icon = isFinished ? "✓ " : "🎙️ "
            let displayText = self.formatTrailingLines(prefix: icon, text: text)
            let paragraphStyle = NSMutableParagraphStyle()
            paragraphStyle.lineSpacing = 3
            paragraphStyle.lineBreakMode = .byWordWrapping
            
            let attrString = NSAttributedString(
                string: displayText,
                attributes: [
                    .font: NSFont.systemFont(ofSize: 15, weight: .medium),
                    .foregroundColor: NSColor.white,
                    .paragraphStyle: paragraphStyle
                ]
            )
            self.statusLabel.attributedStringValue = attrString
        }
    }
    
    func formatTrailingLines(prefix: String, text: String) -> String {
        let full = text.trimmingCharacters(in: .whitespacesAndNewlines)
        if full.isEmpty { return "\(prefix)Listening..." }
        let words = full.components(separatedBy: .whitespaces).filter { !$0.isEmpty }
        if words.count > 32 {
            let recentWords = words.suffix(30).joined(separator: " ")
            return "\(prefix)... \(recentWords)"
        }
        return "\(prefix)\(full)"
    }
    
    func show(text: String) {
        DispatchQueue.main.async {
            self.updateLiveText(text)
            self.centerOnScreen()
            self.alphaValue = 0.0
            self.orderFrontRegardless()
            NSAnimationContext.runAnimationGroup { context in
                context.duration = 0.12
                self.animator().alphaValue = 1.0
            }
        }
    }
    
    func hide() {
        DispatchQueue.main.async {
            NSAnimationContext.runAnimationGroup({ context in
                context.duration = 0.25
                self.animator().alphaValue = 0.0
            }, completionHandler: {
                self.orderOut(nil)
            })
        }
    }
}

class DictationController: NSObject {
    static let shared = DictationController()
    let pill = PillWindow()
    let audioEngine = AVAudioEngine()
    var isRecording = false
    var isTranscribingSlice = false
    var pcmLock = NSLock()
    var pcmBuffer = Data()
    
    let snapshotWavURL = URL(fileURLWithPath: "/tmp/whisper_stream_snapshot.wav")
    let finalWavURL = URL(fileURLWithPath: "/tmp/whisper_stream_final.wav")
    var streamTimer: DispatchSourceTimer?
    var lastTranscribedText = ""
    let whisperCliPath = "/opt/homebrew/bin/whisper-cli"
    
    let liveModelPath: String = {
        let home = FileManager.default.homeDirectoryForCurrentUser.path
        let baseEn = "\(home)/.whisper-models/ggml-base.en.bin"
        if FileManager.default.fileExists(atPath: baseEn) { return baseEn }
        return "\(home)/.whisper-models/ggml-large-v3-turbo.bin"
    }()
    
    let finalModelPath: String = {
        let home = FileManager.default.homeDirectoryForCurrentUser.path
        let turbo = "\(home)/.whisper-models/ggml-large-v3-turbo.bin"
        if FileManager.default.fileExists(atPath: turbo) { return turbo }
        return "\(home)/.whisper-models/ggml-base.en.bin"
    }()
    
    func toggle() {
        if isRecording { stopAndTranscribe() } else { startRecording() }
    }
    
    func startRecording() {
        guard !isRecording else { return }
        isRecording = true
        lastTranscribedText = ""
        pcmLock.lock()
        pcmBuffer.removeAll(keepingCapacity: true)
        pcmLock.unlock()
        
        let inputNode = audioEngine.inputNode
        let inputFormat = inputNode.outputFormat(forBus: 0)
        let sampleRate = inputFormat.sampleRate
        let strideStep = max(1, Int(round(sampleRate / 16000.0)))
        
        inputNode.installTap(onBus: 0, bufferSize: 1024, format: inputFormat) { [weak self] (buffer, when) in
            guard let self = self, self.isRecording else { return }
            guard let channelData = buffer.floatChannelData?[0] else { return }
            let frameCount = Int(buffer.frameLength)
            
            var chunk = Data(capacity: (frameCount / strideStep) * 2)
            for i in stride(from: 0, to: frameCount, by: strideStep) {
                let sample = max(-1.0, min(1.0, channelData[i]))
                let int16 = Int16(sample * 32767.0)
                var little = int16.littleEndian
                withUnsafeBytes(of: &little) { chunk.append(contentsOf: $0) }
            }
            self.pcmLock.lock()
            self.pcmBuffer.append(chunk)
            self.pcmLock.unlock()
        }
        
        do {
            try audioEngine.start()
            NSSound(named: "Tink")?.play()
            pill.show(text: "Listening...")
            startLiveStreamTimer()
        } catch {
            print("Failed to start audio engine: \(error)")
            isRecording = false
        }
    }
    
    func startLiveStreamTimer() {
        let timer = DispatchSource.makeTimerSource(queue: DispatchQueue.global(qos: .userInteractive))
        timer.schedule(deadline: .now() + 0.45, repeating: 0.45)
        timer.setEventHandler { [weak self] in self?.decodeLiveSnapshot() }
        timer.resume()
        self.streamTimer = timer
    }
    
    func stopLiveStreamTimer() {
        streamTimer?.cancel()
        streamTimer = nil
    }
    
    func decodeLiveSnapshot() {
        guard isRecording, !isTranscribingSlice else { return }
        isTranscribingSlice = true
        defer { isTranscribingSlice = false }
        
        pcmLock.lock()
        let currentPcm = pcmBuffer
        pcmLock.unlock()
        guard currentPcm.count > 12800 else { return }
        
        let wavData = createWavData(from: currentPcm)
        try? wavData.write(to: snapshotWavURL)
        let text = runTranscription(audioPath: snapshotWavURL.path, isFinal: false)
        if !text.isEmpty {
            lastTranscribedText = text
            pill.updateLiveText(text)
        }
    }
    
    func stopAndTranscribe() {
        guard isRecording else { return }
        isRecording = false
        stopLiveStreamTimer()
        audioEngine.stop()
        audioEngine.inputNode.removeTap(onBus: 0)
        NSSound(named: "Pop")?.play()
        
        pcmLock.lock()
        let finalPcm = pcmBuffer
        pcmLock.unlock()
        
        DispatchQueue.global(qos: .userInitiated).async { [weak self] in
            guard let self = self else { return }
            var text = ""
            if finalPcm.count > 6400 {
                let finalWav = self.createWavData(from: finalPcm)
                try? finalWav.write(to: self.finalWavURL)
                text = self.runTranscription(audioPath: self.finalWavURL.path, isFinal: true)
            }
            if text.isEmpty { text = self.lastTranscribedText }
            
            DispatchQueue.main.async {
                if !text.isEmpty {
                    self.pill.updateLiveText(text, isFinished: true)
                    let pasteboard = NSPasteboard.general
                    pasteboard.clearContents()
                    pasteboard.setString(text, forType: .string)
                    DispatchQueue.main.asyncAfter(deadline: .now() + 0.05) {
                        self.pasteIntoFrontmostApp()
                    }
                }
                DispatchQueue.main.asyncAfter(deadline: .now() + 1.2) {
                    self.pill.hide()
                }
            }
        }
    }
    
    func createWavData(from pcm: Data) -> Data {
        var data = Data()
        let sampleRate: Int32 = 16000
        let channels: Int16 = 1
        let bitsPerSample: Int16 = 16
        let byteRate = sampleRate * Int32(channels) * Int32(bitsPerSample / 8)
        let blockAlign = channels * (bitsPerSample / 8)
        let subchunk2Size = Int32(pcm.count)
        let chunkSize = 36 + subchunk2Size

        data.append("RIFF".data(using: .ascii)!)
        data.append(withUnsafeBytes(of: chunkSize.littleEndian) { Data($0) })
        data.append("WAVE".data(using: .ascii)!)
        data.append("fmt ".data(using: .ascii)!)
        let subchunk1Size: Int32 = 16
        data.append(withUnsafeBytes(of: subchunk1Size.littleEndian) { Data($0) })
        let audioFormat: Int16 = 1
        data.append(withUnsafeBytes(of: audioFormat.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: channels.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: sampleRate.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: byteRate.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: blockAlign.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: bitsPerSample.littleEndian) { Data($0) })
        data.append("data".data(using: .ascii)!)
        data.append(withUnsafeBytes(of: subchunk2Size.littleEndian) { Data($0) })
        data.append(pcm)
        return data
    }
    
    func runTranscription(audioPath: String, isFinal: Bool) -> String {
        let process = Process()
        process.executableURL = URL(fileURLWithPath: whisperCliPath)
        let tmpTxt = "/tmp/whisper_pill_out_\(UUID().uuidString.prefix(6))"
        let model = isFinal ? finalModelPath : liveModelPath
        
        process.arguments = [
            "-m", model,
            "-f", audioPath,
            "-l", "en",
            "-t", "8",
            "-nt",
            "-np",
            "-otxt",
            "-of", tmpTxt
        ]
        
        do {
            try process.run()
            process.waitUntilExit()
            let txtFile = URL(fileURLWithPath: "\(tmpTxt).txt")
            if let content = try? String(contentsOf: txtFile, encoding: .utf8) {
                try? FileManager.default.removeItem(at: txtFile)
                return content.trimmingCharacters(in: .whitespacesAndNewlines)
            }
        } catch {
            print("Whisper execution failed: \(error)")
        }
        return ""
    }
    
    func pasteIntoFrontmostApp() {
        let src = CGEventSource(stateID: .hidSystemState)
        let vKeyCode: CGKeyCode = 9 // 'v'
        if let keyDown = CGEvent(keyboardEventSource: src, virtualKey: vKeyCode, keyDown: true) {
            keyDown.flags = .maskCommand
            keyDown.post(tap: .cghidEventTap)
        }
        if let keyUp = CGEvent(keyboardEventSource: src, virtualKey: vKeyCode, keyDown: false) {
            keyUp.flags = .maskCommand
            keyUp.post(tap: .cghidEventTap)
        }
    }
}

class AppDelegate: NSObject, NSApplicationDelegate {
    var isRightOptionDown = false
    func applicationDidFinishLaunching(_ notification: Notification) {
        NSEvent.addGlobalMonitorForEvents(matching: .flagsChanged) { [weak self] event in
            guard let self = self else { return }
            let isOption = event.modifierFlags.contains(.option)
            let isRight = (event.modifierFlags.rawValue & 0x40) != 0
            if isOption && isRight {
                if !self.isRightOptionDown {
                    self.isRightOptionDown = true
                    DictationController.shared.startRecording()
                }
            } else {
                if self.isRightOptionDown {
                    self.isRightOptionDown = false
                    DictationController.shared.stopAndTranscribe()
                }
            }
        }
        let sigSource = DispatchSource.makeSignalSource(signal: SIGUSR1, queue: .main)
        sigSource.setEventHandler { DictationController.shared.toggle() }
        sigSource.resume()
        signal(SIGUSR1, SIG_IGN)
    }
}

### 3.3 File 3: Meeting Summarizer with AGI-First Multi-Tier Routing (`~/EmptyOne/summarize_meeting.py`)

This engine implements the **"First Go to AGI"** rule. Transcripts are sanitized locally via regex and local LLM, then routed directly to Google Antigravity / Gemini CLI (`agy`). If offline, it falls back to Local LM Studio (port 1234), and finally to deterministic rules:

```python
#!/usr/bin/env python3
"""
summarize_meeting.py: Turn meeting transcripts into executive summaries & interactive HTML reports.
Features:
- Live audio-synced interactive transcript with auto-scrolling & click-to-seek.
- AI-synthesized notes with dynamic additional sections (PV, Technical, Risks, etc.).
- Multi-tier processing: FIRST GO TO AGI (Gemini / noteworthy-notes) -> Local LLM (LM Studio / Ollama) -> Heuristic fallback.
- Local DLP privacy redaction of secrets, tokens, and credentials before cloud transit.
"""

import sys
import os
import re
import json
import urllib.request
import urllib.error
import subprocess
from datetime import datetime
from pathlib import Path


def local_dlp_sanitize(text: str) -> tuple[str, list]:
    """Redacts secrets, API keys, tokens, and passwords locally before transit to Cloud AI."""
    redacted = []
    sanitized = text

    patterns = [
        (r"(?i)\b(sk-[a-zA-Z0-9_-]{20,})\b", "[REDACTED_API_KEY]"),
        (r"(?i)\b(AIzaSy[a-zA-Z0-9_-]{33})\b", "[REDACTED_GEMINI_KEY]"),
        (r"(?i)\b(ghp_[a-zA-Z0-9]{36})\b", "[REDACTED_GITHUB_TOKEN]"),
        (r"(?i)\b(password|passwd|secret)\s*[:=]\s*([^\s,;]+)", r"\1: [REDACTED_SECRET]"),
        (r"(?i)\b(bearer\s+[a-zA-Z0-9._~+/-]+=*)", "[REDACTED_BEARER_TOKEN]"),
    ]

    for pat, rep in patterns:
        matches = re.findall(pat, sanitized)
        if matches:
            redacted.extend(matches)
            sanitized = re.sub(pat, rep, sanitized)

    return sanitized, redacted


def summarize_with_gemini(transcript: str) -> dict:
    """Tier 1 (PRIMARY): Route directly to Google Antigravity / Gemini CLI with noteworthy-notes skill."""
    prompt = f"""You are an elite executive notes synthesizer.
Analyze this meeting transcript and produce insightful, noteworthy meeting notes.
Never output raw verbatim transcript quotes; group discussions by real conceptual themes, explain the 'why' and context, and extract explicit decisions and action items.

You are also encouraged to dynamically create any additional relevant domain-specific sections under 'additional_sections' (such as 'Product Vision (PV) & Scope', 'Technical Architecture & Invariants', 'Open Questions & Risks', 'Timelines & Deadlines', etc.).

Transcript:
\"\"\"
{transcript[:30000]}
\"\"\"

Respond STRICTLY in valid JSON matching this schema:
{{
  "title": "Short Descriptive Title",
  "takeaways": ["key takeaway 1", "key takeaway 2"],
  "discussions": [
    {{
      "topic": "Conceptual Topic Name",
      "summary": "Synthesized explanation with context",
      "bullets": ["Insight A", "Insight B"]
    }}
  ],
  "decisions": ["Explicit decision 1"],
  "action_items": [
    {{"task": "Concrete task", "owner": "Name or Unassigned", "status": "pending"}}
  ],
  "additional_sections": [
    {{
      "heading": "Product Vision (PV) & Scope",
      "content": "Synthesized architectural or vision takeaways"
    }}
  ]
}}"""

    try:
        # Invoke agy (Antigravity CLI) non-interactively
        proc = subprocess.run(
            ["agy", "-p", prompt, "--model", "gemini-2.5-flash", "--output-format", "json"],
            capture_output=True,
            text=True,
            timeout=35
        )
        if proc.returncode == 0 and proc.stdout:
            match = re.search(r"\{[\s\S]*\}", proc.stdout)
            if match:
                data = json.loads(match.group(0))
                if data.get("discussions"):
                    print("✓ Synthesized with Tier 1: Gemini AGI.")
                    return data
    except Exception as e:
        print(f"Notice: Gemini AGI processing skipped or timed out ({e}). Falling back to Tier 2 local model...")

    return {}


def summarize_with_local_llm(transcript: str) -> dict:
    """Tier 2 (OFFLINE FALLBACK): Route to Local LM Studio / Ollama (Port 1234)."""
    prompt = f"Analyze meeting transcript and output valid JSON with title, takeaways, discussions, decisions, and action_items:\n\n{transcript[:8000]}"
    try:
        req = urllib.request.Request(
            "http://127.0.0.1:1234/v1/chat/completions",
            data=json.dumps({
                "model": "qwen2.5-coder-7b",
                "messages": [
                    {"role": "system", "content": "You are an executive notes synthesizer. Output valid JSON only."},
                    {"role": "user", "content": prompt}
                ],
                "temperature": 0.2
            }).encode("utf-8"),
            headers={"Content-Type": "application/json"}
        )
        with urllib.request.urlopen(req, timeout=12) as resp:
            res = json.loads(resp.read().decode("utf-8"))
            content = res["choices"][0]["message"]["content"]
            match = re.search(r"\{[\s\S]*\}", content)
            if match:
                data = json.loads(match.group(0))
                if data.get("discussions"):
                    print("✓ Synthesized with Tier 2: Local LM Studio.")
                    return data
    except Exception:
        pass
    return {}


def fallback_rule_based(transcript: str) -> dict:
    """Tier 3 (SAFETY FALLBACK): Deterministic extraction when all LLMs are offline."""
    lines = [l.strip() for l in transcript.splitlines() if l.strip()]
    return {
        "title": "Meeting Summary (Heuristic Fallback)",
        "takeaways": lines[:3] if lines else ["Meeting recorded successfully."],
        "discussions": [{"topic": "Meeting Audio Transcript", "summary": "Full audio transcribed locally via Whisper Metal.", "bullets": lines[:8]}],
        "decisions": ["Meeting audio preserved locally in ~/EmptyOne/meetings/."],
        "action_items": [{"task": "Review recorded audio transcript", "owner": "Unassigned", "status": "pending"}],
        "additional_sections": []
    }


def main():
    if len(sys.argv) < 2:
        print("Usage: summarize_meeting.py <transcript.txt> [audio.wav]")
        sys.exit(1)

    txt_file = Path(sys.argv[1]).resolve()
    wav_file = Path(sys.argv[2]).resolve() if len(sys.argv) > 2 else None
    meeting_dir = txt_file.parent

    raw_transcript = txt_file.read_text(encoding="utf-8")
    sanitized_transcript, redactions = local_dlp_sanitize(raw_transcript)

    # Multi-Tier Cascade: Tier 1 AGI -> Tier 2 Local LLM -> Tier 3 Rules
    data = summarize_with_gemini(sanitized_transcript)
    if not data or not data.get("discussions"):
        data = summarize_with_local_llm(sanitized_transcript)
    if not data or not data.get("discussions"):
        data = fallback_rule_based(sanitized_transcript)

    # Save summary.json and summary.md
    (meeting_dir / "summary.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
    
    md_out = f"# {data.get('title', 'Meeting Summary')}\n\n"
    md_out += "## Key Takeaways\n" + "\n".join(f"- {t}" for t in data.get("takeaways", [])) + "\n\n"
    md_out += "## Decisions\n" + "\n".join(f"- {d}" for d in data.get("decisions", [])) + "\n\n"
    md_out += "## Action Items\n" + "\n".join(f"- [ ] **{a['task']}** ({a.get('owner', 'Unassigned')})" for a in data.get("action_items", [])) + "\n"
    (meeting_dir / "summary.md").write_text(md_out, encoding="utf-8")

    print(f"Summary generated successfully in {meeting_dir}")


if __name__ == "__main__":
    main()

## 1. System Topology & Dual-Pipeline Architecture

The meeting recording system provides native 1-click & global hotkey meeting capture with immediate local Whisper transcription and **First Go to AGI** executive synthesis:

## 2. Invariants & Operational Directives

### 2.1 The "First Go to AGI" Rule
Meeting synthesis strictly follows a 3-tier cascade:
1. **Tier 1 (Primary - Google Antigravity / Gemini CLI):** Cloud AGI is invoked first using the `noteworthy-notes` skill. It groups discussion by conceptual themes, analyzes context and the 'why', and extracts dynamic domain sections (*Product Vision & Scope*, *Technical Architecture*, *Risks & Blockers*).
2. **Tier 2 (Offline Fallback - Local LLM):** If internet is unreachable or AGI times out ($>35\text{ s}$), it falls back to a local model on `http://127.0.0.1:1234`.
3. **Tier 3 (Safety Fallback - Deterministic NLP):** If no local LLM is active, a deterministic zero-dependency parser ensures that executive notes are always generated.

### 2.2 Local DLP Privacy & Redaction
Before any transcript is transmitted to Tier 1 Cloud AGI, `summarize_meeting.py` executes local regex-based sanitization. API keys (`sk-...`, `AIzaSy...`), credentials, bearer tokens, and passwords are substituted with indexed variables (e.g. `[REDACTED_API_KEY_1]`).

### 2.3 Double-Tap Hotkey State Machine
Double-tapping `Option` (`⌥ ⌥`) triggers recording start/stop. To prevent accidental triggers when using standard modifier chords:
- The interval between presses must be strictly between **$0.04\text{ s}$ and $0.45\text{ s}$**.
- Any interleaved keystroke resets the state machine to `Date.distantPast`.
- Pressing `Option + Esc` or clicking the red `[✕ Cancel]` button on the floating HUD immediately discards the recording, cleanly unlinks the audio directory, and avoids generating empty transcripts.

### 2.4 Stealth Mode (`--stealth` / `-s`)
When enabled via CLI flag or Menu Bar item:
- Suppresses the on-screen floating pill HUD completely.
- Bypasses opening the browser tab upon meeting conclusion.
- Delivers a private macOS notification: *"Meeting summary ready in EmptyOne/meetings/..."*.
- Guarantees zero UI leakage during client presentations or screen-sharing sessions.

### 2.5 Dual-Pool Disk Quota Auto-Pruning (`prune_meetings.py`)
To prevent meetings from consuming unbounded disk space:
- **Heavy Pool (Audio/Video - 5,000 MB Max):** Oldest raw `audio.wav` files are pruned first once capacity is exceeded.
- **Light Pool (Transcripts/Summaries - 500 MB Max):** Preserves `summary.html`, `summary.md`, and text notes indefinitely.

class MeetingManager: NSObject {
    static let shared = MeetingManager()
    let pill = FloatingStatusPill()
    let audioEngine = AVAudioEngine()
    var statusItem: NSStatusItem?
    
    var stealthMode: Bool = CommandLine.arguments.contains("--stealth") || CommandLine.arguments.contains("--no-hud") || CommandLine.arguments.contains("-s")
    var isRecording = false
    var recordingTimer: Timer?
    var elapsedSeconds = 0
    var currentMeetingDir: URL?
    var currentWavURL: URL?
    var pcmLock = NSLock()
    var pcmBuffer = Data()
    
    let baseMeetingsDir: URL = {
        let home = FileManager.default.homeDirectoryForCurrentUser
        let dir = home.appendingPathComponent("EmptyOne/meetings")
        try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
        return dir
    }()
    
    let whisperModelPath: String = {
        let home = FileManager.default.homeDirectoryForCurrentUser.path
        let turbo = "\(home)/.whisper-models/ggml-large-v3-turbo.bin"
        let base = "\(home)/.whisper-models/ggml-base.en.bin"
        if FileManager.default.fileExists(atPath: turbo) { return turbo }
        return base
    }()
    
    func toggle() {
        if isRecording { stopAndSummarize() } else { startRecording() }
    }
    
    func toggleStealth() {
        stealthMode = !stealthMode
        if stealthMode { pill.hide() }
        if let del = NSApplication.shared.delegate as? AppDelegate {
            del.updateStealthMenuState()
        }
    }
    
    func startRecording() {
        guard !isRecording else { return }
        isRecording = true
        elapsedSeconds = 0
        pcmLock.lock()
        pcmBuffer.removeAll(keepingCapacity: true)
        pcmLock.unlock()
        
        let formatter = DateFormatter()
        formatter.dateFormat = "yyyy-MM-dd_HH-mm-ss"
        let folderName = "Meeting_\(formatter.string(from: Date()))"
        let meetingDir = baseMeetingsDir.appendingPathComponent(folderName)
        try? FileManager.default.createDirectory(at: meetingDir, withIntermediateDirectories: true)
        
        self.currentMeetingDir = meetingDir
        self.currentWavURL = meetingDir.appendingPathComponent("audio.wav")
        
        let inputNode = audioEngine.inputNode
        let inputFormat = inputNode.outputFormat(forBus: 0)
        let sampleRate = inputFormat.sampleRate
        let strideStep = max(1, Int(round(sampleRate / 16000.0)))
        
        inputNode.installTap(onBus: 0, bufferSize: 2048, format: inputFormat) { [weak self] (buffer, when) in
            guard let self = self, self.isRecording else { return }
            guard let channelData = buffer.floatChannelData?[0] else { return }
            let frameCount = Int(buffer.frameLength)
            
            var chunk = Data(capacity: (frameCount / strideStep) * 2)
            for i in stride(from: 0, to: frameCount, by: strideStep) {
                let sample = max(-1.0, min(1.0, channelData[i]))
                let int16 = Int16(sample * 32767.0)
                var little = int16.littleEndian
                withUnsafeBytes(of: &little) { chunk.append(contentsOf: $0) }
            }
            self.pcmLock.lock()
            self.pcmBuffer.append(chunk)
            self.pcmLock.unlock()
        }
        
        do {
            try audioEngine.start()
            NSSound(named: "Tink")?.play()
            if !stealthMode {
                pill.show(text: "🔴 Recording Meeting... [00:00]", isRecording: true)
            }
            updateStatusItem(title: "🔴 00:00")
            if let del = NSApplication.shared.delegate as? AppDelegate {
                del.updateMenuRecordingState(isRecording: true)
            }
            
            DispatchQueue.main.async {
                self.recordingTimer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in
                    guard let self = self, self.isRecording else { return }
                    self.elapsedSeconds += 1
                    let mins = self.elapsedSeconds / 60
                    let secs = self.elapsedSeconds % 60
                    let timeStr = String(format: "%02d:%02d", mins, secs)
                    if !self.stealthMode {
                        self.pill.updateText("🔴 Recording Meeting... [\(timeStr)]", isRecording: true)
                    }
                    self.updateStatusItem(title: "🔴 \(timeStr)")
                }
            }
        } catch {
            print("Audio engine failed: \(error)")
            isRecording = false
        }
    }
    
    func cancelRecording() {
        guard isRecording else { return }
        isRecording = false
        recordingTimer?.invalidate()
        recordingTimer = nil
        audioEngine.stop()
        audioEngine.inputNode.removeTap(onBus: 0)
        pcmLock.lock()
        pcmBuffer.removeAll(keepingCapacity: false)
        pcmLock.unlock()
        NSSound(named: "Basso")?.play()
        
        if let dir = currentMeetingDir {
            try? FileManager.default.removeItem(at: dir)
        }
        currentMeetingDir = nil
        currentWavURL = nil
        updateStatusItem(title: "🎙️")
        if let del = NSApplication.shared.delegate as? AppDelegate {
            del.updateMenuRecordingState(isRecording: false)
        }
        if !stealthMode {
            pill.showCanceledReaction()
        }
    }
    
    func stopAndSummarize() {
        guard isRecording else { return }
        isRecording = false
        recordingTimer?.invalidate()
        recordingTimer = nil
        audioEngine.stop()
        audioEngine.inputNode.removeTap(onBus: 0)
        NSSound(named: "Pop")?.play()
        
        if !stealthMode {
            pill.updateText("⏳ Transcribing with Whisper Metal...", isRecording: false)
        }
        updateStatusItem(title: "⏳ Transcribing...")
        if let del = NSApplication.shared.delegate as? AppDelegate {
            del.updateMenuRecordingState(isRecording: false)
        }
        
        pcmLock.lock()
        let recordedPcm = pcmBuffer
        pcmLock.unlock()
        
        guard let wavURL = currentWavURL, let meetingDir = currentMeetingDir else { return }
        
        DispatchQueue.global(qos: .userInitiated).async { [weak self] in
            guard let self = self else { return }
            let wavData = self.createWavData(from: recordedPcm)
            try? wavData.write(to: wavURL)
            
            let transcriptBase = meetingDir.appendingPathComponent("transcript").path
            let whisperCli = "/opt/homebrew/bin/whisper-cli"
            let whisperProc = Process()
            whisperProc.executableURL = URL(fileURLWithPath: whisperCli)
            whisperProc.arguments = [
                "-m", self.whisperModelPath,
                "-f", wavURL.path,
                "-l", "en",
                "-otxt",
                "-oj",
                "-of", transcriptBase,
                "-t", "8",
                "-np"
            ]
            try? whisperProc.run()
            whisperProc.waitUntilExit()
            
            let txtFile = meetingDir.appendingPathComponent("transcript.txt")
            if !FileManager.default.fileExists(atPath: txtFile.path) {
                try? "Meeting recording completed. No audible speech detected.".write(to: txtFile, atomically: true, encoding: .utf8)
            }
            
            DispatchQueue.main.async {
                if !self.stealthMode {
                    self.pill.updateText("🧠 FIRST GO TO AGI: Executive Synthesis...", isRecording: false)
                }
                self.updateStatusItem(title: "🧠 Summarizing...")
            }
            
            let summaryProc = Process()
            summaryProc.executableURL = URL(fileURLWithPath: "/usr/bin/python3")
            let homeDir = FileManager.default.homeDirectoryForCurrentUser.path
            let summarizerScript = "\(homeDir)/EmptyOne/summarize_meeting.py"
            summaryProc.arguments = [summarizerScript, txtFile.path, wavURL.path]
            try? summaryProc.run()
            summaryProc.waitUntilExit()
            
            let htmlURL = meetingDir.appendingPathComponent("summary.html")
            DispatchQueue.main.async {
                if !self.stealthMode {
                    self.pill.updateText("✓ Meeting Summary Ready! Opening in browser...", isRecording: false)
                    self.updateStatusItem(title: "🎙️")
                    if FileManager.default.fileExists(atPath: htmlURL.path) {
                        NSWorkspace.shared.open(htmlURL)
                    }
                    self.pill.hide(after: 2.5)
                } else {
                    self.updateStatusItem(title: "🎙️")
                }
            }
        }
    }
    
    func updateStatusItem(title: String) {
        DispatchQueue.main.async { self.statusItem?.button?.title = title }
    }
    
    func createWavData(from pcm: Data) -> Data {
        var data = Data()
        let sampleRate: Int32 = 16000
        let channels: Int16 = 1
        let bitsPerSample: Int16 = 16
        let byteRate = sampleRate * Int32(channels) * Int32(bitsPerSample / 8)
        let blockAlign = channels * (bitsPerSample / 8)
        let subchunk2Size = Int32(pcm.count)
        let chunkSize = 36 + subchunk2Size

        data.append("RIFF".data(using: .ascii)!)
        data.append(withUnsafeBytes(of: chunkSize.littleEndian) { Data($0) })
        data.append("WAVE".data(using: .ascii)!)
        data.append("fmt ".data(using: .ascii)!)
        let subchunk1Size: Int32 = 16
        data.append(withUnsafeBytes(of: subchunk1Size.littleEndian) { Data($0) })
        let audioFormat: Int16 = 1
        data.append(withUnsafeBytes(of: audioFormat.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: channels.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: sampleRate.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: byteRate.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: blockAlign.littleEndian) { Data($0) })
        data.append(withUnsafeBytes(of: bitsPerSample.littleEndian) { Data($0) })
        data.append("data".data(using: .ascii)!)
        data.append(withUnsafeBytes(of: subchunk2Size.littleEndian) { Data($0) })
        data.append(pcm)
        return data
    }
}

## 4. Source File 2: Dual-Pool Retention Auto-Pruner (`~/EmptyOne/prune_meetings.py`)

This script runs autonomously in the background to enforce the dual-pool storage invariant:

```python
#!/usr/bin/env python3
"""
prune_meetings.py: Independent auto-cleanup of meeting recordings & summaries.
Treats audio/video files and text summaries/transcripts with separate capacity limits.
Deletes oldest audio/video first to free disk space, while preserving notes and summaries.
"""

import sys
import os
import json
from pathlib import Path


DEFAULT_CONFIG = {
    "audio_video": {
        "max_size_mb": 5000,   # 5 GB max total audio/video storage
        "max_count": 20        # Keep up to 20 raw audio/video files
    },
    "transcripts_summaries": {
        "max_size_mb": 500,    # 500 MB max for text transcripts & summaries
        "max_count": 100       # Keep up to 100 meeting summaries
    }
}

AUDIO_EXTENSIONS = {".wav", ".mp3", ".m4a", ".mp4", ".mov", ".flac", ".ogg", ".webm"}
TEXT_EXTENSIONS = {".txt", ".md", ".html", ".json"}


def get_config(meetings_dir: Path) -> dict:
    config_file = meetings_dir / "retention.json"
    if config_file.exists():
        try:
            with open(config_file, "r", encoding="utf-8") as f:
                cfg = json.load(f)
                return {
                    "audio_video": {**DEFAULT_CONFIG["audio_video"], **cfg.get("audio_video", {})},
                    "transcripts_summaries": {**DEFAULT_CONFIG["transcripts_summaries"], **cfg.get("transcripts_summaries", {})}
                }
        except Exception:
            pass
    return DEFAULT_CONFIG


def get_file_size_mb(path: Path) -> float:
    try:
        return path.stat().st_size / (1024 * 1024)
    except Exception:
        return 0.0


def prune_meetings(meetings_dir_path: str = None) -> dict:
    if not meetings_dir_path:
        meetings_dir = Path.home() / "EmptyOne/meetings"
    else:
        meetings_dir = Path(meetings_dir_path).resolve()

    if not meetings_dir.exists():
        return {"status": "skipped", "reason": "Meetings directory does not exist"}

    config = get_config(meetings_dir)
    audio_cfg = config["audio_video"]
    text_cfg = config["transcripts_summaries"]

    max_audio_mb = float(audio_cfg.get("max_size_mb", 5000))
    max_audio_count = int(audio_cfg.get("max_count", 20))
    max_text_mb = float(text_cfg.get("max_size_mb", 500))
    max_text_count = int(text_cfg.get("max_count", 100))

    meeting_folders = [
        f for f in meetings_dir.iterdir()
        if f.is_dir() and f.name.startswith("Meeting_")
    ]
    meeting_folders.sort(key=lambda x: x.stat().st_mtime)

    # 1. Prune Oldest Audio Files First (Heavy Pool)
    audio_files = []
    for folder in meeting_folders:
        for f in folder.iterdir():
            if f.is_file() and f.suffix.lower() in AUDIO_EXTENSIONS:
                audio_files.append(f)

    audio_files.sort(key=lambda x: x.stat().st_mtime)
    total_audio_mb = sum(get_file_size_mb(f) for f in audio_files)
    deleted_audio = []

    for af in list(audio_files):
        if total_audio_mb > max_audio_mb or len(audio_files) > max_audio_count:
            size_mb = get_file_size_mb(af)
            try:
                af.unlink()
                deleted_audio.append(str(af))
                audio_files.remove(af)
                total_audio_mb -= size_mb
            except Exception:
                pass
        else:
            break

    # 2. Prune Oldest Summaries only if light pool is saturated
    text_files = []
    for folder in meeting_folders:
        for f in folder.iterdir():
            if f.is_file() and f.suffix.lower() in TEXT_EXTENSIONS:
                text_files.append(f)

    total_text_mb = sum(get_file_size_mb(f) for f in text_files)
    deleted_meetings = []

    for folder in list(meeting_folders):
        if total_text_mb > max_text_mb or len(meeting_folders) > max_text_count:
            folder_text_mb = sum(get_file_size_mb(f) for f in folder.iterdir() if f.is_file())
            try:
                import shutil
                shutil.rmtree(folder)
                deleted_meetings.append(folder.name)
                meeting_folders.remove(folder)
                total_text_mb -= folder_text_mb
            except Exception:
                pass
        else:
            break

    return {
        "audio_deleted_count": len(deleted_audio),
        "meetings_deleted_count": len(deleted_meetings),
        "total_audio_mb": round(total_audio_mb, 2),
        "total_text_mb": round(total_text_mb, 2),
        "remaining_meetings": len(meeting_folders)
    }


if __name__ == "__main__":
    target = sys.argv[1] if len(sys.argv) > 1 else None
    print(json.dumps(prune_meetings(target), indent=2))

## 2. Invariants & Mathematical Formulas

### 2.1 Comments Per 100 Lines Changed
Quantifies a reviewer's thoroughness / nitpickiness regardless of PR size:
$$\text{Comments per 100} = \frac{\text{Total Review Comments}}{\sum (\text{Additions} + \text{Deletions})} \times 100$$

### 2.2 Category Distribution Breakdown
Comments are categorized into 8 orthogonal buckets:
- `ARCHITECTURE`, `SECURITY`, `PERFORMANCE`, `TESTING`, `ERROR_HANDLING`, `STYLE_NITS`, `DOCUMENTATION`, `OTHER`.

### 2.3 Holdout Recall & Precision (CodeT Protocol)
To ensure the synthesized persona accurately mimics the reviewer without hallucinating irrelevant issues, the evaluation engine performs holdout cross-validation:
$$\text{Recall} = \frac{|\text{Simulated Issues} \cap \text{Actual Historical Issues}|}{|\text{Actual Historical Issues}|}$$
$$\text{Precision} = \frac{|\text{Simulated Issues} \cap \text{Actual Historical Issues}|}{|\text{Simulated Issues}|}$$
$$\text{F1-Score} = 2 \times \frac{\text{Precision} \times \text{Recall}}{\text{Precision} + \text{Recall}}$$

### 4.2 SQLite Storage Engine (`~/EmptyOne/digest/core/storage.py`)

```python
from __future__ import annotations
import json
import os
import sqlite3
from pathlib import Path
from typing import Dict, List, Optional, Tuple

from digest.core.models import (
    CommentCategory,
    PullRequest,
    Review,
    ReviewComment,
    ReviewerStats,
    ReviewVerdict,
)

DEFAULT_DB_PATH = os.path.expanduser("~/.local/share/digest_store/reviews.db")


class StorageEngine:
    def __init__(self, db_path: str = DEFAULT_DB_PATH):
        self.db_path = db_path
        if db_path != ":memory:":
            Path(db_path).parent.mkdir(parents=True, exist_ok=True)
        self.conn = sqlite3.connect(db_path)
        self.conn.row_factory = sqlite3.Row
        self._init_schema()

    def _init_schema(self) -> None:
        with self.conn:
            self.conn.execute("""
                CREATE TABLE IF NOT EXISTS pull_requests (
                    id INTEGER PRIMARY KEY,
                    number INTEGER,
                    repo TEXT,
                    title TEXT,
                    body TEXT,
                    author TEXT,
                    state TEXT,
                    diff TEXT,
                    changed_files TEXT,
                    additions INTEGER,
                    deletions INTEGER,
                    merged_at TEXT,
                    UNIQUE(repo, number)
                )
            """)
            self.conn.execute("""
                CREATE TABLE IF NOT EXISTS reviews (
                    id TEXT PRIMARY KEY,
                    pr_number INTEGER,
                    repo TEXT,
                    author TEXT,
                    state TEXT,
                    body TEXT,
                    submitted_at TEXT
                )
            """)
            self.conn.execute("""
                CREATE TABLE IF NOT EXISTS comments (
                    id TEXT PRIMARY KEY,
                    pr_number INTEGER,
                    repo TEXT,
                    author TEXT,
                    path TEXT,
                    line INTEGER,
                    diff_hunk TEXT,
                    body TEXT,
                    created_at TEXT,
                    category TEXT,
                    is_socratic BOOLEAN,
                    is_praise BOOLEAN
                )
            """)

    def save_pull_request(self, pr: PullRequest) -> None:
        with self.conn:
            self.conn.execute("""
                INSERT INTO pull_requests (
                    id, number, repo, title, body, author, state, diff,
                    changed_files, additions, deletions, merged_at
                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                ON CONFLICT(repo, number) DO UPDATE SET
                    title=excluded.title,
                    body=excluded.body,
                    diff=excluded.diff,
                    changed_files=excluded.changed_files,
                    additions=excluded.additions,
                    deletions=excluded.deletions
            """, (
                pr.id, pr.number, pr.repo, pr.title, pr.body, pr.author, pr.state,
                pr.diff, json.dumps(pr.changed_files), pr.additions, pr.deletions, pr.merged_at
            ))

    def save_review(self, review: Review) -> None:
        with self.conn:
            self.conn.execute("""
                INSERT OR REPLACE INTO reviews (
                    id, pr_number, repo, author, state, body, submitted_at
                ) VALUES (?, ?, ?, ?, ?, ?, ?)
            """, (
                review.id, review.pr_number, review.repo, review.author,
                review.state.value, review.body, review.submitted_at
            ))
            for c in review.comments:
                self.save_comment(c)

    def save_comment(self, comment: ReviewComment) -> None:
        with self.conn:
            self.conn.execute("""
                INSERT OR REPLACE INTO comments (
                    id, pr_number, repo, author, path, line, diff_hunk,
                    body, created_at, category, is_socratic, is_praise
                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            """, (
                comment.id, comment.pr_number, comment.repo, comment.author,
                comment.path, comment.line, comment.diff_hunk, comment.body,
                comment.created_at, comment.category.value,
                int(comment.is_socratic), int(comment.is_praise)
            ))

    def get_reviewer_prs(self, reviewer: str) -> List[PullRequest]:
        cursor = self.conn.execute("""
            SELECT DISTINCT pr.* FROM pull_requests pr
            JOIN reviews r ON pr.repo = r.repo AND pr.number = r.pr_number
            WHERE r.author = ? COLLATE NOCASE
        """, (reviewer,))
        rows = cursor.fetchall()
        prs = []
        for r in rows:
            prs.append(PullRequest(
                id=r["id"],
                number=r["number"],
                repo=r["repo"],
                title=r["title"] or "",
                body=r["body"] or "",
                author=r["author"] or "",
                state=r["state"] or "closed",
                diff=r["diff"] or "",
                changed_files=json.loads(r["changed_files"] or "[]"),
                additions=r["additions"] or 0,
                deletions=r["deletions"] or 0,
                merged_at=r["merged_at"]
            ))
        return prs

    def get_reviewer_comments(self, reviewer: str) -> List[ReviewComment]:
        cursor = self.conn.execute("""
            SELECT * FROM comments WHERE author = ? COLLATE NOCASE
        """, (reviewer,))
        rows = cursor.fetchall()
        comments = []
        for r in rows:
            cat_str = r["category"] or "OTHER"
            try:
                cat = CommentCategory(cat_str)
            except ValueError:
                cat = CommentCategory.OTHER
            comments.append(ReviewComment(
                id=r["id"],
                pr_number=r["pr_number"],
                repo=r["repo"],
                author=r["author"],
                path=r["path"] or "",
                line=r["line"],
                diff_hunk=r["diff_hunk"] or "",
                body=r["body"] or "",
                created_at=r["created_at"] or "",
                category=cat,
                is_socratic=bool(r["is_socratic"]),
                is_praise=bool(r["is_praise"])
            ))
        return comments

    def get_reviewer_verdict_for_pr(self, repo: str, pr_number: int, reviewer: str) -> str:
        cursor = self.conn.execute("""
            SELECT state FROM reviews
            WHERE repo = ? AND pr_number = ? AND author = ? COLLATE NOCASE
            ORDER BY submitted_at DESC LIMIT 1
        """, (repo, pr_number, reviewer))
        row = cursor.fetchone()
        return row["state"] if row else "COMMENTED"

    def close(self) -> None:
        self.conn.close()
```

# Component Specification 05: Antigravity Customization Architecture, Plugins & Directives
**Component ID:** `antigravity-customizations`

## 1. Antigravity Customization Architecture & Discovery Priority

The Google Antigravity (AGY) agent runtime discovers and resolves skills, rules, and plugins through a strict 3-tier precedence hierarchy:

```mermaid
graph TD
    subgraph DiscoveryHierarchy["Antigravity Discovery & Precedence Engine"]
        L1["Tier 1: Project Repository (<repo>/.agents/skills/)<br/>Checked into VCS, shared with team, overrides host"]
        L2["Tier 2: Global Host Environment (~/.gemini/config/skills/)<br/>Machine-wide developer tools, statusline, Whisper HUD"]
        L3["Tier 3: Builtin CLI Engine (~/.gemini/antigravity-cli/builtin/)<br/>Default foundational toolchain"]
        
        L1 -->|Overrides| L2
        L2 -->|Overrides| L3
    end

    subgraph PluginArchitecture["Plugin Internal Structure"]
        P_JSON["plugin.json (Manifest & Version)"]
        P_RULES["rules/AGENTS.md (Injected into Agent System Prompt)"]
        P_SKILLS["skills/<name>/SKILL.md (Dynamic On-Demand Trigger)"]
    end

    L2 --> PluginArchitecture
```

---

## 2. Invariants & Context Preservation Directives

1. **Context Window Token Preservation:** Skills are **not** dumped unconditionally into the LLM context window. Instead:
   - Behavioral directives in `rules/AGENTS.md` are active globally.
   - Heavy procedural instructions in `SKILL.md` are loaded **only when their trigger criteria are met** (e.g. non-coding tasks bypass `eval-coding-guidance` to save tokens).
2. **Standard YAML Frontmatter Contract:** Every skill directory must contain a valid `SKILL.md` with lowercase hyphenated frontmatter:
   ```yaml
   ---
   name: my-custom-skill
   description: Trigger-focused description with explicit keywords and scenarios.
   ---
   ```
3. **Idempotent Executable Scripts:** Scripts inside `scripts/` must enforce `set -euo pipefail`, handle Apple Silicon architectures, and maintain `chmod +x`.

## 2. What Google ID Syncs vs. What Stays Local & How Models Are Handled

### A. Gemini AGI Models (0 MB Download Required)
- **Google Antigravity & Gemini CLI** models (Gemini 2.5 Pro/Flash, Gemini 3.0, etc.) are **cloud-hosted by Google**.
- They run directly on Google Cloud TPU infrastructure.
- **Zero local model files are downloaded** for Gemini reasoning; your Google ID authenticates and streams inference directly via Google's API.

### B. Local Whisper Metal Models (~2.3 GB on this machine)
Your speech dictation HUD and meeting recorder use local Apple Silicon GPU acceleration via `whisper.cpp` (`whisper-cli`) and store weights in `~/.whisper-models/`:
- `ggml-base.en.bin` (141 MB) – Ultra-low latency live streaming dictation (~30ms response)
- `ggml-large-v3-turbo.bin` (1.5 GB) – High accuracy meeting transcription
- `ggml-parakeet-tdt-0.6b-v3-q8_0.bin` (638 MB) – Fast fallback model

### C. Does the New Machine Need to Download the Models?
**No, the migration script handles it automatically either way:**

1. **Option 1: Zero-Download / Fully Offline (Default in `./export_setup.sh`)**
   - The export script packages all 3 model files directly from `~/.whisper-models/` into `~/gemini_migration_bundle/models/`.
   - When running `./restore_on_new_mac.sh` on the new Mac, it detects the bundled `.bin` files and copies them into `~/.whisper-models/` with **0 MB downloaded**.
   - Your speech dictation and meeting recorder work immediately offline.

2. **Option 2: Lightweight Transfer (If you run `./export_setup.sh --no-models`)**
   - If you prefer a tiny archive (~50 MB) to transfer quickly over email or chat, use `./export_setup.sh --no-models`.
   - The restore script on the target Mac will automatically detect that models are absent and download `ggml-base.en.bin` via `curl -C -` during setup without any manual steps.
